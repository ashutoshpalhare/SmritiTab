name: Refresh patched dependency lockfile

on:
  push:
    branches:
      - React-Vite-source-muse
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smrititab-dependency-lock
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: React-Vite-source-muse

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve patched dependency lockfile
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only

      - name: Install exactly from the refreshed lockfile
        run: npm ci

      - name: Require a clean dependency audit
        run: npm audit --audit-level=low

      - name: Verify source
        run: |
          npm run typecheck
          npm test
          npm run build:extension
          npm run validate:manifest

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already matches the patched dependency tree."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: refresh patched dependency lockfile"
            git push origin HEAD:React-Vite-source-muse
          fi
