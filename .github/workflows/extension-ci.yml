name: Extension CI

on:
  push:
    branches:
      - main
      - React-Vite-source-muse
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extension-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test and package extension
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependency tree
        continue-on-error: true
        run: |
          npm audit --audit-level=high

      - name: Typecheck source when available
        run: |
          if node -e "process.exit(require('./package.json').scripts?.typecheck ? 0 : 1)"; then
            npm run typecheck
          else
            echo "No TypeScript source check in this runtime."
          fi

      - name: Run automated tests
        run: npm test

      - name: Build and validate extension
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['build:extension'] ? 0 : 1)"; then
            npm run build:extension
            npm run validate:manifest
          else
            npm run verify
            npm run build
            npm run verify:dist
          fi

      - name: Upload extension and audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smrititab-extension
          path: |
            dist-extension/
            dist/
          if-no-files-found: error
          retention-days: 7
