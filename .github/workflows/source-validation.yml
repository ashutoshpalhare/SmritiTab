name: React/Vite source validation

on:
  push:
    branches:
      - React-Vite-source-muse
  pull_request:
    branches:
      - React-Vite-source-muse
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smrititab-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, tests and MV3 package
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build Chrome extension
        run: npm run build:extension

      - name: Validate unpacked extension package
        run: npm run validate:manifest

      - name: Upload unpacked extension
        uses: actions/upload-artifact@v4
        with:
          name: smrititab-dist-extension
          path: dist-extension/
          if-no-files-found: error
          retention-days: 7
